[package]
name = "fbservo"
version = "0.1.0"
edition = "2021"
description = "Servo (Rust browser engine) rendering straight into the Linux framebuffer"

[[bin]]
name = "fbservo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
url = "2.5"
dpi = "0.1"
euclid = "0.22"
# Servo と同じ版にする (RenderingContext::gleam_gl_api が返す Gl をそのまま使うため)
gleam = "=0.15.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
# multiprocess / clipboard は使わない (クリップボードは X/Wayland 前提)
servo = { version = "=0.7.0", default-features = false, features = ["bundled", "js_jit"] }

# servo-paint: 1px 未満しかはみ出していない overflow: auto の箱がスクロールを吸い込む問題を直した版
# (vendor/servo-paint/webview_renderer.rs の scroll_node_or_ancestor_skipping_subpixel)
# servo-layout: 絶対配置の子を親の padding の分だけずらして数え、scrollHeight / scrollWidth が
# padding-top / padding-left の分だけ大きくなる問題を直した版。ResizeSensor で枠を中身に合わせるページ
# (情報処理学会の電子図書館など) が、枠を伸ばし続ける
# (vendor/servo-layout/fragment_tree/box_fragment.rs の calculate_scrollable_overflow)
[patch.crates-io]
servo-paint = { path = "vendor/servo-paint" }
servo-layout = { path = "vendor/servo-layout" }

[profile.release]
opt-level = 3
debug = false
strip = true
